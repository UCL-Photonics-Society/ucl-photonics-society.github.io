name: Publish website

on:
  # Every commit on main (e.g. a merged pull request): build and publish the website
  push:
    branches: [main]
  # Allows running the workflow manually from the "Actions" tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a running deployment is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: uv run quarto render

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quarto_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
