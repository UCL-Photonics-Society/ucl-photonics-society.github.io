name: Build & deploy website

on:
  # Every pull request to main: check that the website builds without errors
  pull_request:
    branches: [main]
  # Every change merged into main: build and publish the website
  push:
    branches: [main]
  # Allows running the workflow manually from the "Actions" tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: uv run quarto render

      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quarto_output

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
