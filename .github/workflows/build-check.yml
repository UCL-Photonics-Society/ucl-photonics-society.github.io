name: Check website build

on:
  # Pull requests targeting main: runs when the PR is opened or reopened,
  # and again on every new commit pushed to the source branch (synchronize)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new commit on the same PR cancels the previous, now outdated, check
concurrency:
  group: build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: uv run quarto render
